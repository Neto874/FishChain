<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{ product.product_name }} | Fish Feed</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Edit Product</h1>
  <form action="" method="post" enctype="multipart/form-data" class="w-50">
    {% csrf_token %}
    <div class="mb-3">
      <label for="product_name" class="form-label">Product Name</label>
      <input type="text" class="form-control" name="product_name" value="{{ product.product_name }}" required>
    </div>

    <div class="mb-3">
      <label for="product_description" class="form-label">Description</label>
      <textarea class="form-control" name="product_description">{{ product.product_description }}</textarea>
    </div>

    <div class="mb-3">
      <label for="feed_type" class="form-label">Feed Type</label>
      <input type="text" class="form-control" name="feed_type" value="{{ product.feed_type }}">
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">Price</label>
      <input type="number" class="form-control" name="price" value="{{ product.price }}" required>
    </div>

    <div class="mb-3">
      <label for="exp_date" class="form-label">Expiry Date</label>
      <input type="text" class="form-control" name="exp_date" value="{{ product.exp_date }}">
    </div>

    <div class="mb-3">
      <label for="quantity_available" class="form-label">Quantity Available</label>
      <input type="number" class="form-control" name="quantity_available" value="{{ product.quantity_available }}">
    </div>

    <div class="mb-3">
      <label for="product_thumbnail" class="form-label">Product Thumbnail</label>
      <input type="file" class="form-control" name="product_thumbnail" accept="image/*">
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'fish_feed:distributor_dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
