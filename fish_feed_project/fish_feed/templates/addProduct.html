<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | Fish Feed</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Add New Product</h1>
  <form action="" method="post" enctype="multipart/form-data" class="w-50">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input type="text" class="form-control" name="product_name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="product_description"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Feed Type</label>
      <input type="text" class="form-control" name="feed_type">
    </div>

    <div class="mb-3">
      <label class="form-label">Price</label>
      <input type="number" class="form-control" name="price" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Expiry Date</label>
      <input type="text" class="form-control" name="exp_date">
    </div>

    <div class="mb-3">
      <label class="form-label">Quantity Available</label>
      <input type="number" class="form-control" name="quantity_available" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Thumbnail</label>
      <input type="file" class="form-control" name="product_thumbnail" accept="image/*">
    </div>

    <button type="submit" class="btn btn-success">Add Product</button>
    <a href="{% url 'fish_feed:distributor_dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
