{%load static%}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Fish Feed</title>

    <!-- don't forget to switch to make this django appropriate later -->
    <link rel="stylesheet" href="{%static "css/auth.css"%}" />

    <!-- Bootstrap CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <!-- Bootstrap Icons -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"> -->

  </head>
  <body>
    <div class="parent-container">
      <div class="left-card" style = "background-image: url('{%static "images/auth-img.png"%}')">
        <div class="logo-container"> <img src="{%static "images/logo.png"%}"  alt="" height="99px" width="148px"></div>
        <div class="socials-container">
            <img src="{%static "images/socials/icons8-facebook-logo-30.png"%}" alt="" height="15px" width="15px">
            <img src="{%static "images/socials/icons8-instagram-logo-50.png"%}" alt="" height="15px" width="15px">
            <img src="{%static "images/socials/icons8-linkedin-2-48.png"%}" alt="" height="15px" width="15px">
            <img src="{%static "images/socials/icons8-x-50 (1).png"%}" alt="" height="15px" width="15px">
        </div>
        <!-- <img src="../img/auth-img.png" alt="" height="100%" width="68%"> -->
      </div>

      <div class="right-signup-card">
        <p style="font-size: 30px">
          Buy
          <span style="color: rgba(166, 133, 127, 1)">Quality Fish Feed</span>
          at an Affordable Price
        </p>
        <p style="font-size: 20px">Log in</p>
        <div class="form-container">
          <form action="{% url 'accounts:login' %}" method="POST">
            {% csrf_token %}
            <input
              type="text"
              name="username"
              class="form-control"
              placeholder="Enter Username"
              required
            />
            <br />


            <input
              type="password"
              name="password"
              class="form-control"
              placeholder="Enter Password"
              required
            />
            <br />

            <button type="submit" class="submit-form-btn">Log in</button>
          </form>
        </div>

        <div class="login-link">
          <p>
            Don't have an aacount?
            <a class="switch" href="{% url 'accounts:signup' %}">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
